name: Build Astro and publish GitHub Pages

on:
  push:
    branches: [main]
    tags: ['site-v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate source and Pages fallback
        run: npm run validate

      - name: Build Astro
        run: npm run build

      - name: Install Chromium for browser regression tests
        run: npx playwright install --with-deps chromium

      - name: Run responsive browser regression suite
        run: npm run test:e2e

      - name: Upload browser-test evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence-${{ github.run_attempt }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload verified Pages build
        uses: actions/upload-artifact@v4
        with:
          name: pages-dist-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 3

  bootstrap:
    if: github.event_name == 'push' && github.ref_name == 'main' && contains(github.event.head_commit.message, '[bootstrap-22-factor]')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout the reviewed main commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Download the exact verified Pages build
        uses: actions/download-artifact@v4
        with:
          name: pages-dist-${{ github.sha }}
          path: dist

      - name: Bootstrap the 22-factor Pages snapshot
        shell: bash
        run: |
          set -euo pipefail
          npm run sync:pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html favicon.svg robots.txt site.css .nojekyll CNAME img styles fallback.js 22-factor-app
          if [ -d _astro ]; then git add -- _astro; fi
          if git diff --cached --quiet; then
            echo "The checked-in Pages snapshot already matches the reviewed build."
          else
            git commit -m "chore: bootstrap 22-factor Pages snapshot [skip ci]"
            git push origin HEAD:main
          fi

  verify_live:
    if: github.event_name == 'push' && github.ref_name == 'main' && contains(github.event.head_commit.message, '[verify-22-factor-live]')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Verify the public 22-factor endpoint
        shell: bash
        env:
          LIVE_URL: https://oresoftware.github.io/22-factor-app/
        run: |
          set -euo pipefail
          response="$(mktemp)"
          trap 'rm -f "$response"' EXIT
          verified=0

          for attempt in $(seq 1 12); do
            status="$(curl --silent --show-error --location --max-time 20 --output "$response" --write-out '%{http_code}' "$LIVE_URL" || true)"
            if [ "$status" = "200" ] \
              && grep -Fq 'The 22-Factor App' "$response" \
              && grep -Fq 'env/enc/dev.env.enc' "$response" \
              && grep -Fq 'id="history-integration"' "$response"; then
              verified=1
              break
            fi
            echo "Attempt ${attempt}: endpoint not ready or content contract incomplete (HTTP ${status:-none})."
            sleep 5
          done

          test "$verified" = "1"
          echo "Verified ${LIVE_URL}: HTTP 200 and required manifesto contracts are present."

      - name: Record successful public verification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LIVE_URL: https://oresoftware.github.io/22-factor-app/
        run: |
          set -euo pipefail
          body="$(cat <<EOF
          ## Public endpoint verified

          GitHub-hosted smoke verification reached ${LIVE_URL} with HTTP 200 and confirmed the rendered 22-Factor title, encrypted env/enc contract, and Factor XXII history-integration anchor.

          - Commit: ${GITHUB_SHA}
          - Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          )"
          gh issue comment 6 --repo "$GITHUB_REPOSITORY" --body "$body"

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/site-v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout the tagged release
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Require an annotated tag on the current main commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git cat-file -t "${GITHUB_REF_NAME}")" = "tag"
          test "$(git rev-parse "${GITHUB_REF_NAME}^{commit}")" = "$(git rev-parse origin/main)"

      - name: Download the verified Pages build
        uses: actions/download-artifact@v4
        with:
          name: pages-dist-${{ github.sha }}
          path: dist

      - name: Publish the tagged Astro output to the Pages branch root
        shell: bash
        run: |
          set -euo pipefail
          npm run sync:pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html favicon.svg robots.txt site.css .nojekyll CNAME img styles fallback.js 22-factor-app
          if [ -d _astro ]; then git add -- _astro; fi
          if git diff --cached --quiet; then
            echo "The checked-in Pages snapshot already matches the tagged Astro build."
          else
            git commit -m "chore: publish ${GITHUB_REF_NAME} Pages snapshot [skip ci]"
            git push origin HEAD:main
          fi
