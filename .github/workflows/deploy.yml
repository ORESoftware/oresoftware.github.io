name: Build Astro and publish GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate source and Pages fallback
        run: npm run validate

      - name: Build Astro
        run: npm run build

      - name: Install Chromium for browser regression tests
        run: npx playwright install --with-deps chromium

      - name: Run responsive browser regression suite
        run: npm run test:e2e

      - name: Upload browser-test evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence-${{ github.run_attempt }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish Astro output to the legacy Pages branch root
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          npm run sync:pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- index.html favicon.svg robots.txt site.css .nojekyll CNAME img styles fallback.js
          if [ -d _astro ]; then git add -A -- _astro; fi
          if git diff --cached --quiet; then
            echo "The checked-in Pages snapshot already matches the Astro build."
          else
            git commit -m "chore: publish Astro Pages snapshot [skip ci]"
            git push origin HEAD:main
          fi
