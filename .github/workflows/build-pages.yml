name: Build Astro Pages

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'tests/**'
      - 'astro.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/build-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: oresoftware-astro-pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        shell: bash
        run: |
          if [[ -f package-lock.json ]]; then
            npm ci
          else
            npm install
          fi

      - name: Test the Astro source
        run: npm test

      - name: Build the Astro site
        run: npm run build

      - name: Verify generated output
        shell: bash
        run: |
          test -s dist/index.html
          test -f dist/CNAME
          test -f dist/img/img.png

      - name: Publish Astro output to the Pages root
        shell: bash
        run: |
          cp dist/index.html index.html
          touch .nojekyll
          cp dist/CNAME CNAME
          cp dist/favicon.svg favicon.svg
          cp dist/robots.txt robots.txt
          rm -rf _astro img
          [[ ! -d dist/_astro ]] || cp -R dist/_astro _astro
          cp -R dist/img img
          rm -f styles.css script.js

      - name: Commit generated Astro output
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .nojekyll CNAME favicon.svg robots.txt img
          [[ ! -d _astro ]] || git add _astro
          [[ ! -f package-lock.json ]] || git add package-lock.json
          git add -u -- styles.css script.js || true
          if git diff --cached --quiet; then
            echo 'Astro output is already current.'
            exit 0
          fi
          git commit -m 'Publish Astro output [skip ci]'
          git push origin HEAD:main
